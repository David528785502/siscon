version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: siscon-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env.production
    restart: unless-stopped
    networks:
      - siscon-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: siscon-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - siscon-network

networks:
  siscon-network:
    driver: bridge
