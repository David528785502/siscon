<div class="bg-white rounded-lg shadow">
    <div *ngIf="loading" class="p-8 text-center">
      <p class="text-gray-600">Cargando datos...</p>
    </div>

    <div *ngIf="!loading && solicitudes.length > 0" class="overflow-x-auto">
      <table class="w-full">
        <thead class="bg-gray-50 border-b">
          <tr>
            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">N° Solicitud</th>
            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">Código</th>
            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">Id</th>
            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">Apellidos y Nombres</th>
            <th class="px-4 py-3 text-right text-xs font-semibold text-gray-700 uppercase">Monto S/.</th>
            <th class="px-4 py-3 text-center text-xs font-semibold text-gray-700 uppercase">Plazo</th>
            <th class="px-4 py-3 text-right text-xs font-semibold text-gray-700 uppercase">Cuota</th>
            <th class="px-4 py-3 text-right text-xs font-semibold text-gray-700 uppercase">Liquidez</th>
            <th class="px-4 py-3 text-center text-xs font-semibold text-gray-700 uppercase">Est.</th>
            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">Observación</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200">
          <tr *ngFor="let solicitud of solicitudes" class="hover:bg-gray-50">
            <td class="px-4 py-3 text-sm text-gray-900"><!-- N° Solicitud --></td>
            <td class="px-4 py-3 text-sm text-gray-900"><!-- Código --></td>
            <td class="px-4 py-3 text-sm text-gray-900"><!-- Id --></td>
            <td class="px-4 py-3 text-sm text-gray-900"><!-- Apellidos y Nombres --></td>
            <td class="px-4 py-3 text-sm text-gray-900 text-right font-medium"><!-- Monto --></td>
            <td class="px-4 py-3 text-sm text-gray-900 text-center"><!-- Plazo --></td>
            <td class="px-4 py-3 text-sm text-gray-900 text-right font-medium"><!-- Cuota --></td>
            <td class="px-4 py-3 text-sm text-gray-900 text-right font-medium"><!-- Liquidez --></td>
            <td class="px-4 py-3 text-sm text-center">
              <!-- Estado -->
            </td>
            <td class="px-4 py-3 text-sm text-gray-600"><!-- Observación --></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div *ngIf="!loading && solicitudes.length === 0" class="p-8 text-center text-gray-500">
      No hay solicitudes registradas
    </div>

    <div *ngIf="!loading && solicitudes.length > 0" class="p-4 border-t bg-gray-50">
      <p class="text-sm text-gray-600">Total de registros: {{ solicitudes.length }}</p>
    </div>
  </div>

  <!-- Secciones de Botones -->
  <div class="mt-6 flex flex-wrap gap-6">
    <!-- Sección Izquierda: Importar, Preliminar, Imprimir -->
    <div class="bg-white rounded-lg shadow px-6 py-4">
      <div class="flex flex-wrap gap-3">
        <button class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors shadow-sm">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
          </svg>
          Importar
        </button>
        <button class="inline-flex items-center px-4 py-2 bg-white text-gray-700 border border-gray-300 rounded-md hover:bg-gray-50 transition-colors shadow-sm">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
          Preliminar
        </button>
        <button class="inline-flex items-center px-4 py-2 bg-white text-gray-700 border border-gray-300 rounded-md hover:bg-gray-50 transition-colors shadow-sm">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
          </svg>
          Imprimir
        </button>
      </div>
    </div>

    <!-- Sección Derecha: Capacidad, Consultar, Modificar, Anular, Anular Todo -->
    <div class="bg-white rounded-lg shadow px-6 py-4 flex-1">
      <div class="flex flex-wrap gap-3">
        <button class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors shadow-sm">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
          </svg>
          Capacidad
        </button>
        <button class="inline-flex items-center px-4 py-2 bg-white text-gray-700 border border-gray-300 rounded-md hover:bg-gray-50 transition-colors shadow-sm">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          Consultar
        </button>
        <button class="inline-flex items-center px-4 py-2 bg-white text-gray-700 border border-gray-300 rounded-md hover:bg-gray-50 transition-colors shadow-sm">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
          </svg>
          Modificar
        </button>
        <button class="inline-flex items-center px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 transition-colors shadow-sm">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          Anular
        </button>
        <button class="inline-flex items-center px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 transition-colors shadow-sm">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
          Anular Todo
        </button>
      </div>
    </div>
  </div>
